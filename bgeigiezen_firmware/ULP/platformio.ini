[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ; tanakamasayuki/ESP32 ULP Debugger@^1.1.3
    https://github.com/boarchuz/HULP.git
build_unflags = -Wall -Werror
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -Iulp
    ; Keep the ulp include path for now, might be needed by HULP
    -I.pio/build/esp32dev
    ; Add a custom command to compile ULP assembly and generate header
    ; This is a placeholder and needs the correct command
    ;-D PIO_BUILD_COMMAND='"$PROJECT_PACKAGES_DIR/toolchain-esp32ulp/bin/esp32ulp-elf-as" -o $BUILD_DIR/ulp_geiger_counter.o ulp/ulp_geiger_counter.s && "$PROJECT_PACKAGES_DIR/tool-esptoolpy/esptool.py" --chip esp32s3 merge_bin --output $BUILD_DIR/ulp_main.bin $BUILD_DIR/ulp_geiger_counter.o'

# Optional: optimize for ULP development
; The extra_scripts for ulptool-pio are not needed for HULP
; extra_scripts =
;   pre:/$PROJECT_LIBDEPS_DIR/$PIOENV/ulptool-pio/pre_extra_script_ulptool.py
;   post:/$PROJECT_LIBDEPS_DIR/$PIOENV/ulptool-pio/post_extra_script_ulptool.py

upload_speed = 921600 